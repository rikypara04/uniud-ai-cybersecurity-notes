<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" viewBox="0 0 820 280" role="img" aria-labelledby="title desc">
  <title id="title">DFA accepting the word cbaba</title>
  <desc id="desc">The initial state q0 moves to accepting state q1 on c. State q1 moves to q2 on b, and q2 returns to q1 on a. The word cbaba finishes in q1.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#263746"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="818" height="278" rx="14" fill="#ffffff" stroke="#d6dee6"/>
  <g fill="none" stroke="#263746" stroke-width="3" marker-end="url(#arrow)">
    <path d="M42 130 L117 130"/>
    <path d="M187 113 C235 65 319 65 367 113"/>
    <path d="M433 113 C486 65 570 65 623 113"/>
    <path d="M623 151 C570 207 486 207 433 151"/>
  </g>
  <g fill="#263746" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">
    <text x="278" y="70">c</text>
    <text x="528" y="70">b</text>
    <text x="528" y="222">a</text>
  </g>
  <g fill="#ffffff" stroke="#263746" stroke-width="3">
    <circle cx="152" cy="132" r="35"/>
    <circle cx="400" cy="132" r="35"/>
    <circle cx="400" cy="132" r="29" fill="none" stroke-width="2"/>
    <circle cx="660" cy="132" r="35"/>
  </g>
  <g fill="#17212b" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" dominant-baseline="middle">
    <text x="152" y="132">q₀</text>
    <text x="400" y="132">q₁</text>
    <text x="660" y="132">q₂</text>
  </g>
  <g fill="#17212b" font-family="Arial, sans-serif" font-size="17">
    <text x="36" y="105">start</text>
    <text x="365" y="264">q₁ is the accepting state (double circle)</text>
  </g>
</svg>
